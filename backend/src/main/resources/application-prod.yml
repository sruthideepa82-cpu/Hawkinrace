# Production.
#
# CORS is NOT defaulted here. An empty allowed-origins list means no browser
# origin is granted access unless the operator sets CORS_ALLOWED_ORIGINS to the
# exact deployed frontend origin. Failing closed is the right default: a missing
# env var should not silently open the API to everything.
nitrorun:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
