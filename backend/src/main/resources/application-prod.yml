# Production.
#
# CORS is NOT defaulted here. An empty allowed-origins list means no browser
# origin is granted access unless the operator sets CORS_ALLOWED_ORIGINS to the
# exact deployed frontend origin. Failing closed is the right default: a missing
# env var should not silently open the API to everything.
nitrorun:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

spring:
  jpa:
    show-sql: false
  flyway:
    # A production deploy applies pending migrations on start. There is no
    # `clean` anywhere in this configuration, and never will be.

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health